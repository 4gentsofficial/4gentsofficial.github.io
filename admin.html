<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4 GENTS — Design Editor</title>
<style>
:root{--bg:#07070c;--card:#101019;--primary:#8b5cf6;--secondary:#22d3ee;--text:#fff;--muted:#9ca3af}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;padding:16px}
.wrap{max-width:760px;margin:auto}.sub{color:var(--muted)}.panel{background:var(--card);border:1px solid #292936;border-radius:18px;padding:18px;margin:18px 0}
h1{margin:0 0 6px}h2{margin-top:0}label{display:block;font-weight:bold;margin:15px 0 7px}
input[type=color]{width:100%;height:54px;border:0;padding:0;border-radius:12px;background:transparent}
select,button{width:100%;min-height:52px;border-radius:12px;padding:12px;font-size:16px;color:#fff;background:#191923;border:1px solid #333}
button{background:var(--primary);border:0;font-weight:bold;margin-top:14px}.secondary{background:#22222e!important}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.status{margin-top:14px;padding:14px;border-radius:12px;background:#181821;color:var(--muted);line-height:1.5}
@media(max-width:520px){.row{grid-template-columns:1fr}body{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
<h1>🎮 4 GENTS</h1><div class="sub">Phone-friendly Website Design Editor</div>
<section class="panel">
<h2>🎨 Website Design</h2>
<label>Primary Color</label><input type="color" id="primaryColor" value="#8B5CF6">
<label>Secondary Color</label><input type="color" id="secondaryColor" value="#22D3EE">
<label>Background Color</label><input type="color" id="backgroundColor" value="#07070C">
<label>Card Color</label><input type="color" id="cardColor" value="#101019">
<label>Text Color</label><input type="color" id="textColor" value="#FFFFFF">
<div class="row">
<div><label>Animations</label><select id="animationEnabled"><option value="true">✨ On</option><option value="false">Off</option></select></div>
<div><label>Glow Effect</label><select id="glowEnabled"><option value="true">🌟 On</option><option value="false">Off</option></select></div>
</div>
<button onclick="copyDesignJSON()">📋 Copy Design JSON</button>
<button class="secondary" onclick="resetDesign()">🔄 Reset</button>
<div id="status" class="status">Choose your colors, then tap <b>Copy Design JSON</b>.</div>
</section>
<section class="panel">
<h2>📰 News Admin</h2>
<div class="sub">Open your existing news editor.</div>
<button onclick="location.href='admin.html'">📰 Open News Editor</button>
</section>
</div>
<script>
function getDesign(){return{theme:{primary:primaryColor.value,secondary:secondaryColor.value,background:backgroundColor.value,card:cardColor.value,text:textColor.value,muted:"#9CA3AF"},animations:{enabled:animationEnabled.value==="true",intensity:"medium"},effects:{glow:glowEnabled.value==="true",cardHover:true}}}
async function copyDesignJSON(){const json=JSON.stringify(getDesign(),null,2);try{await navigator.clipboard.writeText(json)}catch(e){const t=document.createElement("textarea");t.value=json;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}status.innerHTML="✅ <b>Copied!</b> Open GitHub → design.json → Edit → delete old JSON → paste → Commit changes."}
function resetDesign(){primaryColor.value="#8B5CF6";secondaryColor.value="#22D3EE";backgroundColor.value="#07070C";cardColor.value="#101019";textColor.value="#FFFFFF";animationEnabled.value="true";glowEnabled.value="true";status.textContent="Design reset to the 4 GENTS default theme."}
</script>
</body>
</html>
